<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gltf2b3dm — 在线转换 / 预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; background: #1a1d22; color: #e6e8eb; overflow: hidden; }
  #topbar { height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #23272e; border-bottom: 1px solid #333; }
  #topbar h1 { font-size: 15px; font-weight: 600; color: #fff; }
  #topbar .hint { font-size: 12px; color: #8b929c; }
  #drop { margin-left: auto; font-size: 12px; color: #8b929c; }
  input[type=file] { display: none; }
  .btn { background: #3a7bd5; color: #fff; border: 0; padding: 6px 14px; border-radius: 5px; font-size: 13px; cursor: pointer; }
  .btn:hover { background: #4a8be5; }
  .btn.sec { background: #3a3f47; }
  .btn.sec:hover { background: #4a4f57; }
  #main { display: flex; height: calc(100% - 48px); }
  .pane { flex: 1; position: relative; border-right: 1px solid #333; min-width: 0; }
  .pane:last-child { border-right: 0; }
  .pane-label { position: absolute; top: 8px; left: 8px; z-index: 5; background: rgba(0,0,0,0.55); padding: 4px 10px; border-radius: 4px; font-size: 12px; pointer-events: none; }
  .pane-stats { position: absolute; bottom: 8px; left: 8px; z-index: 5; background: rgba(0,0,0,0.55); padding: 6px 10px; border-radius: 4px; font-size: 11px; line-height: 1.5; color: #b9c0c9; pointer-events: none; white-space: pre; }
  .pane-diag { position: absolute; top: 36px; left: 8px; z-index: 5; background: rgba(0,0,0,0.5); padding: 3px 8px; border-radius: 4px; font-size: 11px; color: #9fe6a0; pointer-events: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #panel { width: 300px; background: #23272e; border-left: 1px solid #333; overflow-y: auto; flex-shrink: 0; }
  .overlay-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #6b727c; font-size: 13px; z-index: 4; text-align: center; padding: 20px; }
  .spinner { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 10; color: #3a7bd5; font-size: 13px; background: rgba(0,0,0,0.6); padding: 10px 18px; border-radius: 6px; display: none; }
  #log { position: fixed; bottom: 0; right: 300px; max-width: 480px; max-height: 120px; overflow-y: auto; background: rgba(0,0,0,0.8); font-size: 11px; font-family: monospace; padding: 8px 12px; border-top-left-radius: 6px; color: #9fe6a0; z-index: 20; white-space: pre-wrap; display: none; }
</style>
</head>
<body>
<div id="topbar">
  <h1>gltf2b3dm</h1>
  <label class="btn" for="file">打开 glTF / glb</label>
  <input type="file" id="file" accept=".gltf,.glb">
  <button class="btn sec" id="reconvert">重新转换</button>
  <button class="btn sec" id="download" disabled>下载 b3dm</button>
  <span class="hint" id="status">拖入或选择一个 glTF/glb 文件开始</span>
  <span id="drop">支持拖放</span>
</div>
<div id="main">
  <div class="pane" id="paneL">
    <div class="pane-label">原始 glTF / glb</div>
    <div class="pane-stats" id="statsL"></div>
    <div class="pane-diag" id="diagL"></div>
    <div class="overlay-msg" id="msgL">尚未加载模型</div>
    <div class="spinner" id="spinL">加载中…</div>
  </div>
  <div class="pane" id="paneR">
    <div class="pane-label">转换后 b3dm（经 b3dm2gltf 反解）</div>
    <div class="pane-stats" id="statsR"></div>
    <div class="pane-diag" id="diagR"></div>
    <div class="overlay-msg" id="msgR">转换后在此预览</div>
    <div class="spinner" id="spinR">转换中…</div>
  </div>
  <div id="panel"></div>
</div>
<div id="log"></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/"
  }
}
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
